name: Android Money Snapshot
on:
  push:
    branches: [main]
    paths: ['android/**', 'apps/financial-reset/**', 'assets/**', 'course/assets/course.css', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'apps/financial-reset/**', 'assets/**', 'course/assets/course.css', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test shared financial calculations
        run: node --test apps/financial-reset/tests/*.test.cjs android/tests/*.test.cjs
      - name: Verify offline bundle
        run: python3 -m unittest discover -s android/tests -p 'test_*.py'
      - name: Test bundled Android content in a mobile browser
        id: browser
        continue-on-error: true
        run: |
          python3 android/scripts/bundle_web.py
          npm install --prefix "${RUNNER_TEMP}/snapshot-browser" --ignore-scripts playwright@1.56.1
          PLAYWRIGHT_MODULE="${RUNNER_TEMP}/snapshot-browser/node_modules/playwright" CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node android/tests/web-smoke.cjs
      - name: Build and check Android application
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Money-Snapshot-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Money-Snapshot-Android-Unsigned-Release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Money-Snapshot-Android-Checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
      - name: Require browser smoke test
        if: steps.browser.outcome != 'success'
        run: exit 1
