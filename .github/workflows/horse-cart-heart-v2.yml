name: Generate horse and cart Heart narration
on:
  workflow_dispatch:
  push:
    branches: [media/horse-cart-heart-v2]
    paths:
      - 'media/horse-cart-heart-v2/narration.json'
      - 'media/horse-cart-heart-v2/synthesize.py'
      - 'media/horse-cart-heart-v2/requirements.txt'
      - '.github/workflows/horse-cart-heart-v2.yml'
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r media/horse-cart-heart-v2/requirements.txt
      - name: Generate natural speech and measure every line
        run: python media/horse-cart-heart-v2/synthesize.py
      - uses: actions/upload-artifact@v4
        with:
          name: Horse-and-Cart-Heart-Audio
          path: media/horse-cart-heart-v2/output/
          retention-days: 30
          if-no-files-found: error
