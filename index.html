<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b22"><meta name="description" content="Explore the seven stages of Let’s Fix Money: Understand, Save, Build Resilience, Preserve, Grow, Transfer and Give."><title>Let’s Fix Money — Your journey starts here</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061b22;color:#f4f5e9;font-family:Arial,Helvetica,sans-serif}
#lfm-future{min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 38%,#133f3b,#061b22 48%,#050e18);padding:clamp(18px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1180px,100%);margin:0 auto}header strong{font-size:clamp(15px,2vw,20px);letter-spacing:.13em}
button,.skip{background:#132e35;color:#f4dfaf;border:1px solid #69877e;border-radius:24px;padding:12px 20px;min-height:44px;font:15px Arial;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a:focus-visible,button:focus-visible{outline:3px solid #f4dfaf;outline-offset:4px}
.scene{width:min(100%,1000px);height:clamp(240px,44vh,480px);margin:8px auto 0}canvas{width:100%;height:100%;display:block}
.caption{text-align:center;min-height:90px}h2{font-size:clamp(26px,4vw,38px);font-weight:400;color:#f4dfaf;margin:8px 0}.caption p{font-size:15px;color:#c4d8d0;margin:10px 0}
ol{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:0;list-style:none;width:min(1180px,100%);margin:18px auto 24px}
li a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;min-height:82px;padding:14px 10px;font-size:16px;text-align:center;color:#f1f4e8;text-decoration:none;background:#142e33;border:1px solid #355950;border-radius:12px}
li a:hover{background:#294b46;border-color:#91b9a8}li.active a{background:#344635;border-color:#f4ce88;color:#ffe6b1}li span{font-size:12px;letter-spacing:.12em;color:#a1c6bb}footer{font-size:14px;color:#bbd0c7}
@media(max-width:800px){ol{grid-template-columns:repeat(4,minmax(0,1fr))}li a{min-height:70px}}
@media(max-width:480px){#lfm-future{padding:18px 16px}.scene{height:260px}.caption{min-height:80px}ol{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px auto 20px}li:last-child{grid-column:1/-1}li a{flex-direction:row;min-height:56px;font-size:15px;padding:12px 8px}header strong{font-size:13px}.skip{padding:11px 14px}.caption p,footer{font-size:13px}}
@media(max-height:560px) and (min-width:700px){.scene{height:200px}#lfm-future{padding:18px}.caption{min-height:65px}ol{margin:10px auto}li a{min-height:60px}}
</style></head><body><main id="lfm-future" aria-label="Let’s Fix Money entry">
<header><strong>LET’S FIX MONEY</strong><a class="skip" id="lfm-skip" href="tools.html">Skip intro ↗</a></header>
<div class="scene"><canvas role="img" aria-label="A luminous spiral widens as it rises and joins a constellation. Choose a learning stage below."></canvas></div>
<div class="caption"><h2>Understand</h2><p>One step at a time. More possibilities ahead.</p></div>
<ol id="explore" aria-label="Choose your learning stage"><li><a href="course/module-1.html" data-label="Understand"><span>01</span>Understand</a></li><li><a href="course/module-3.html" data-label="Save"><span>02</span>Save</a></li><li><a href="course/module-4.html" data-label="Build Resilience"><span>03</span>Build Resilience</a></li><li><a href="course/module-5.html" data-label="Preserve"><span>04</span>Preserve</a></li><li><a href="course/module-6.html" data-label="Grow"><span>05</span>Grow</a></li><li><a href="course/module-7.html" data-label="Transfer"><span>06</span>Transfer</a></li><li><a href="course/module-8.html" data-label="Give"><span>07</span>Give</a></li></ol>
<footer><span id="lfm-status">Choose a stage, or skip to explore the tools.</span><button type="button" id="lfm-replay">Replay</button></footer>
<noscript><p>Choose any stage above, or use Skip to explore the tools.</p></noscript></main>
<script>(()=>{'use strict';const root=document.getElementById('lfm-future');if(!root)return;const canvas=root.querySelector('canvas'),c=canvas.getContext('2d');if(!c)return;const steps=[...root.querySelectorAll('li')],title=root.querySelector('h2'),skip=root.querySelector('#lfm-skip'),status=root.querySelector('#lfm-status'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let w=0,h=0,raf=0,start=0,p=0,done=false;
function point(p,t){const r=8+p*Math.min(w*.35,245),a=p*Math.PI*6-Math.PI/2+t*.28;return[w/2+r*Math.cos(a),h*.87-p*h*.67+r*.18*Math.sin(a)];}function line(points,color,width=1,glow=0){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.lineWidth=width;c.shadowColor=color;c.shadowBlur=glow;c.stroke();c.shadowBlur=0;}function dot(x,y,r,color,glow=0){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.shadowColor=color;c.shadowBlur=glow;c.fill();c.shadowBlur=0;}
function draw(t){c.clearRect(0,0,w,h);for(let i=0;i<65;i++)dot((i*137.51%997)/997*w,(i*79.13%503)/503*h,i%9?0.55:1.2,'#7caea090');for(let j=0;j<7;j++){const q=j/6,r=8+q*Math.min(w*.35,245),cy=h*.87-q*h*.67;c.beginPath();c.ellipse(w/2,cy,r,r*.18,0,0,Math.PI*2);c.strokeStyle='#6acdb52b';c.stroke();dot(w/2+r*Math.cos(t*2+j),cy+r*.18*Math.sin(t*2+j),1.7,'#8cebd0',5);}const ghost=[],path=[],echo=[];for(let i=0;i<=350;i++){const q=i/350,z=point(q,t);ghost.push(z);if(q<=t){path.push(z);echo.push([z[0]+3,z[1]+2]);}}line(ghost,'#8cc5b745');line(echo,'#72eed48c',1,5);line(path,'#f0d49a',2,15);for(let j=0;j<7;j++){const q=j/6,[x,y]=point(q,t);dot(x,y,q<=t?4:2,q<=t?'#fff2ce':'#789f90',q<=t?14:0);}dot(...point(t,t),5,'#fff7df',22);if(t>.83){const a=Math.min(1,(t-.83)/.17);for(const side of[-1,1]){let prev=point(1,t);for(let j=1;j<=3;j++){const end=[w/2+side*w*(.1+j*.075),h*(.1+j*.065)],q=[prev[0]+(end[0]-prev[0])*a,prev[1]+(end[1]-prev[1])*a];line([prev,q],'#8cebd0aa',1,7);dot(...q,2.5,'#d9f7e2',10);prev=q;}}}}
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);c.setTransform(d,0,0,d,0,0);draw(p);}function finish(){cancelAnimationFrame(raf);done=true;p=1;draw(1);title.textContent='Let’s Fix Money';status.textContent='Choose a stage to explore →';try{sessionStorage.setItem('lfm-intro-seen','1');}catch{}}
function tick(now){if(done)return;if(!start)start=now;p=Math.min(1,(now-start)/6000);draw(p);const idx=Math.min(6,Math.floor(p*7));steps.forEach((e,i)=>e.classList.toggle('active',i===idx));title.textContent=steps[idx].querySelector('a').dataset.label;if(p<1)raf=requestAnimationFrame(tick);else finish();}function play(){cancelAnimationFrame(raf);done=false;start=0;if(reduced.matches)finish();else raf=requestAnimationFrame(tick);}root.querySelector('#lfm-replay').addEventListener('click',play);root.addEventListener('keydown',e=>{if(e.key==='Escape')location.href='tools.html';});new ResizeObserver(resize).observe(canvas);reduced.addEventListener('change',()=>{if(reduced.matches)finish();});resize();let seen=false;try{seen=sessionStorage.getItem('lfm-intro-seen')==='1';}catch{}if(seen||reduced.matches)finish();else if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){play();io.disconnect();}},{threshold:.15});io.observe(root);}else play();})();
</script></body></html>
